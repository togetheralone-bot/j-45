name: J45 Hunter

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: normal, test (print only), email-test (send top 20 to inbox)"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - test
          - email-test

jobs:
  hunt:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Restore Facebook session
        run: |
          mkdir -p data
          if [ -n "${{ secrets.FB_SESSION_B64 }}" ]; then
            echo "${{ secrets.FB_SESSION_B64 }}" | base64 -d > data/fb_session.json
            echo "Facebook session restored."
          else
            echo "No FB_SESSION_B64 secret set — Facebook Marketplace will be skipped."
          fi

      - name: Run hunter
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EBAY_APP_ID:        ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID:       ${{ secrets.EBAY_CERT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || 'normal' }}"
          if   [ "$MODE" = "test" ];       then python hunt.py --test
          elif [ "$MODE" = "email-test" ]; then python hunt.py --email-test
          else                                  python hunt.py
          fi

      - name: Commit updated seen listings
        if: ${{ (github.event.inputs.mode || 'normal') == 'normal' }}
        run: |
          git config user.name  "j45-hunter[bot]"
          git config user.email "j45-hunter@users.noreply.github.com"
          git add data/seen_listings.json
          git diff --staged --quiet || git commit -m "chore: update seen listings [skip ci]"
          git push
